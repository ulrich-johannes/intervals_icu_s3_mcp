# Required CI check (SPECIFICATION.md §04): runs the regression suite --
# our own unit tests plus the upstream contract/integration/e2e-smoke
# tests -- on every push and PR, including a vendor/ refresh. Deploy
# itself stays on Fly's "Deploy from GitHub" dashboard flow (no workflow
# here for that, and no CLI for the end user -- see §03/§09); this
# workflow's only job is to be a required status check that blocks
# merging to `main` before Fly ever builds it.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - run: uv sync --all-extras --dev

      - run: uv run pytest -q

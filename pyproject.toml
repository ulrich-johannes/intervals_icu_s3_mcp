[project]
name = "intervals-icu-s3-mcp"
version = "0.1.0"
description = "Combined MCP server: intervals.icu training data + S3-backed trainer memory, OAuth 2.1 gated."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0.0",
    "boto3>=1.34",
    "cryptography>=42",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.1.1",
    "intervals-icu-mcp",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "moto[s3]>=5.0.0",
    "httpx>=0.28.1",
]

[tool.uv.sources]
intervals-icu-mcp = { path = "vendor/intervals-icu-mcp", editable = true }

[project.scripts]
intervals-icu-s3-mcp = "intervals_icu_s3_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intervals_icu_s3_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
